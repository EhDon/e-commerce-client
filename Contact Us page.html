<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>

<style>
   body{
       background-color: #d5d5d5;
       display: flex;
       flex-direction: column;
       justify-content: center;
       align-items: center;

   }
h2{
    font-family: Arial, Helvetica, sans-serif;
}

p{
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.5em;
    text-align: center;
}

button{
    background-color: rebeccapurple;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.5em;
    border: none;
    cursor: pointer;
    border-radius: 3px;
    width: 190px;
}
button:hover{
    background-color: #b7b0bd;
}
label{
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.0em;
    font-weight: bold;
    /*margin-right:250px;*/
}
input{
    font-family: Arial, Helvetica, sans-serif;
   width: 300px;
    height: 25px;
}
textarea{
    font-family: Arial, Helvetica, sans-serif;
    width: 300px;
    height: 60px;

}
form{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

}
</style>
</head>

<body>
<h2>Have any complaints or suggestions?</h2><br>
<p>Place a call: 00000000000</p><br>
<button id="showFormBtn">Send an email</button><br>
<div id="contactForm" style="display:none;">
<form id="emailForm">
    <label >Name:</label><br>
    <input type="text" name="name"><br>
    <label>Email:</label><br>
    <input type="email" name="email"><br>
    <label>Message:</label><br>
    <textarea name="message"></textarea><br>
    <button type="submit">Send</button>
</form>
    <p id="statusMessage"></p>
</div>
<script>
const showFormBtn = document.getElementById('showFormBtn');
const contactFormDiv = document.getElementById('contactForm');
const emailForm = document.getElementById('emailForm');
const statusMessage = document.getElementById('statusMessage');

showFormBtn.addEventListener('click', () => {
   contactFormDiv.style.display =
       contactFormDiv.style.display === 'none' ? 'block' : 'none';
})

emailForm.addEventListener('submit', function (e) {
    e.preventDefault();

})
</script>
</body>
</html>
